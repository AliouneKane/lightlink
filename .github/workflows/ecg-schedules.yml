name: ECG schedules import

# Task 66: load the official ECG schedules of data/ into the hosted database, every day
# and whenever data/ changes on main. Re-running adds no duplicate (ON CONFLICT DO NOTHING).
# Needs the repository secret SUPABASE_DB_URL (Supabase > Project Settings > Database >
# Connection string, session pooler). Without it, the job only checks the generated SQL.
on:
  schedule:
    - cron: "0 5 * * *"
  push:
    branches: [main]
    paths: ["data/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    name: Import ECG schedules
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the import SQL from data/
        run: python prediction/import_schedules.py > schedules.sql
      - name: Import into Supabase
        if: env.SUPABASE_DB_URL != ''
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f schedules.sql
      - name: No database configured
        if: env.SUPABASE_DB_URL == ''
        run: echo "::notice::SUPABASE_DB_URL is not set, import skipped. $(grep -c '^  (' schedules.sql) schedules ready."
