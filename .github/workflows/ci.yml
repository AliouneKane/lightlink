name: CI

# Runs on every push and on every pull request to main.
# A red check means: do not merge.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Web (format, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Check web project exists
        id: has
        working-directory: .
        run: |
          if [ -f web/package.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; echo "No web/package.json yet, skipping."; fi
      - uses: actions/setup-node@v4
        if: steps.has.outputs.found == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.has.outputs.found == 'true'
        run: npm ci
      - name: Prettier
        if: steps.has.outputs.found == 'true'
        run: npm run format:check
      - name: ESLint
        if: steps.has.outputs.found == 'true'
        run: npm run lint --if-present
      - name: Tests
        if: steps.has.outputs.found == 'true'
        run: npm test --if-present
      - name: Typecheck
        if: steps.has.outputs.found == 'true'
        run: npm run typecheck
      - name: Production build
        if: steps.has.outputs.found == 'true'
        run: npm run build
      - name: Install browser
        if: steps.has.outputs.found == 'true'
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        if: steps.has.outputs.found == 'true'
        run: npm run test:e2e

  mobile:
    name: Mobile (Expo, checks, browser journeys)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Expo dependency compatibility
        run: npx expo install --check
      - name: Export Android, iOS and web bundles
        run: npm run export
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests on exported web bundle
        run: npx playwright test
      - name: Upload mobile design captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-design-captures
          path: mobile/artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-failure
          path: |
            mobile/playwright-report/
            mobile/test-results/
          if-no-files-found: ignore
          retention-days: 7

  prediction:
    name: Prediction (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prediction
    steps:
      - uses: actions/checkout@v4
      - name: Check prediction project exists
        id: has
        working-directory: .
        run: |
          if [ -f prediction/requirements.txt ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; echo "No prediction/requirements.txt yet, skipping."; fi
      - uses: actions/setup-python@v5
        if: steps.has.outputs.found == 'true'
        with:
          python-version: "3.11"
      - if: steps.has.outputs.found == 'true'
        run: pip install -r requirements.txt pytest
      - name: Tests
        if: steps.has.outputs.found == 'true'
        run: pytest
